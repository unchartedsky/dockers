name: hyperresearch

on:
  push:
    paths:
      - '.github/workflows/hyperresearch.yml'
      - 'hyperresearch/**'
  workflow_dispatch:
    inputs:
      verify_url:
        description: 'Approved public HTTPS fixture for builtin fetch verification'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hyperresearch:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build for linux/amd64
        run: docker buildx build --platform linux/amd64 --load --tag "$IMAGE" hyperresearch
      - name: Smoke test without network access
        timeout-minutes: 3
        run: |
          docker run --rm --network none \
            --tmpfs /vault:rw,uid=10001,gid=10001,mode=0700 \
            -v "$PWD/hyperresearch/tests:/tests:ro" \
            --entrypoint python "$IMAGE" -I /tests/smoke.py
      - name: Verify builtin fetch with an approved HTTPS fixture
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        env:
          HYPERRESEARCH_SMOKE_PUBLIC_URL: ${{ inputs.verify_url }}
        run: |
          docker run --rm -e HYPERRESEARCH_SMOKE_PUBLIC_URL \
            --tmpfs /vault:rw,uid=10001,gid=10001,mode=0700 \
            -v "$PWD/hyperresearch/tests:/tests:ro" \
            --entrypoint python "$IMAGE" -I /tests/smoke.py --public-fetch
      - uses: docker/login-action@v4
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: docker push "$IMAGE"
